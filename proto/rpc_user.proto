syntax = "proto3";

package pb;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

option go_package = "github.com/lh-khanhduy/banco_de_rata/pb";

service UserServices {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/create_user"
      body: "*"
    };
  }
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse) {
    option (google.api.http) = {
      post: "/v1/login_user"
      body: "*"
    };
  }
  rpc RenewToken(RenewTokenRequest) returns (RenewTokenResponse) {
    option (google.api.http) = {
      post: "/v1/renew_token"
      body: "*"
    };
  }
}

message CreateUserRequest {
  string username  = 1;
  string full_name = 2;
  string email     = 3;
  string password  = 4;
}

message CreateUserResponse {
  User user = 1;
}

message LoginUserRequest {
  string username = 1;
  string password = 2;
}

message LoginUserResponse {
  string                    session_id               = 1;
  string                    access_token             = 2;
  google.protobuf.Timestamp access_token_expired_at  = 3;
  string                    refresh_token            = 4;
  google.protobuf.Timestamp refresh_token_expired_at = 5;
  User                      user                     = 6;
}

message RenewTokenRequest {
  string refresh_token = 1;
}

message RenewTokenResponse {
  string                    access_token            = 1;
  google.protobuf.Timestamp access_token_expired_at = 2;
}