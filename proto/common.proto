syntax = "proto3";

package pb;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lh-khanhduy/banco_de_rata/pb";

message User {
  string                    username            = 1;
  string                    full_name           = 2;
  string                    email               = 3;
  google.protobuf.Timestamp password_changed_at = 4;
  google.protobuf.Timestamp created_at          = 5;
}

message Account {
  int64                     id         = 1;
  string                    owner      = 2;
  int64                     balance    = 3;
  string                    currency   = 4;
  google.protobuf.Timestamp created_at = 5;
}

message IdRequest {
  string id = 1;
}

message IdResponse {
  string id = 1;
}
